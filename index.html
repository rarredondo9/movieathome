<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse movies and TV Shows and build your own Watchlist" />
    <title>Movies at Home</title>
    <link rel="stylesheet" href="/src/css/style.css" />
    <script type="module" src="/src/js/main.mjs"></script>
</head>
<body>
    <header>
        <h1><a href="/" id="home-link"> Movies at Home</a></h1>
        <nav aria-label="Main">
            <a href="/watchlist.html">Watchlist</a>
        </nav>
    </header>
    <main>
        <form id = "search-form" role="search">
            <label for="search-input">Search by Title</label>
            <input type="search" id="search-input" name="query" placeholder="e.g. Avengers">
            <button type="submit">Search</button>
        </form>

        <div id="filters">
            <label for="genre-select">Genre</label>
            <select id="genre-select">
                <option value="">All genres</option>
            </select>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
        <ul id="movie-list" class="movie-grid"></ul>

        <nav id="pager" aria-label="Pagination" hidden>
            <button type="button" id="prev-page">Previous</button>
            <span id="page-info"></span>
            <button type="button" id="next-page">Next</button>
        </nav>
    </main>
</body>
</html>
